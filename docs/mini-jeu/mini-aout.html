<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="aout-style.css">
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        .question { margin-bottom: 20px; font-weight: bold; }
    button {
       background-color: #4caf50; /* Vert */
       border: none;
       color: blanc;
       padding: 15px 32px;
       text-align: center;
       text-decoration: none;
       display: inline-block;
       font-size: 16px;
       margin: 4px 2px;
       cursor: pointer;
     }
   #resultat { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <body>

    <h1>Quiz de culture générale</h1>

    <div class="question">
        <p>1. Quelle est la capitale de la France ?</p>
        <label><input type="radio" name="q1" value="faux"> Londres</label><br>
        <label><input type="radio" name="q1" value="vrai"> Paris</label><br>
        <label><input type="radio" name="q1" value="faux"> Berlin</label>
    </div>

    <div class="question">
        <p>2. Combien font 2 + 2 ?</p>
        <label><input type="radio" name="q2" value="faux"> 3</label><br>
        <label><input type="radio" name="q2" value="vrai"> 4</label><br>
        <label><input type="radio" name="q2" value="faux"> 5</label>
    </div>

    <button onclick="corrigerQuiz()">Valider mes réponses</button>

    <div id="resultat"></div>

    <script>
        function corrigerQuiz() {
            let score = 0;
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
           
            if (q1 && q1.value === "vrai") { score++; }
            if (q2 && q2.value === "vrai") { score++; }

            document.getElementById('resultat').innerText = "Votre score est de : " + score + " / 2";
        }
    </script>

</body>
</html>
