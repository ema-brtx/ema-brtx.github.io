<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test de personnalité</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        .question { margin-bottom: 20px; font-weight: bold; }
    button {
       background-color: #4caf50; /* Vert */
       border: none;
       color: blanc;
       padding: 15px 32px;
       text-align: center;
       text-decoration: none;
       display: inline-block;
       font-size: 16px;
       margin: 4px 2px;
       cursor: pointer;
     }
   #resultat { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <body>

    <h1>Quelle nano es-tu ?</h1>

    <div class="question">
        <p>1. Quel est ton fromage préféré ?</p>
        <label><input type="radio" name="q1" value="t"> le kiri (j'ai pas de thune...)</label><br>
        <label><input type="radio" name="q1" value="m"> un petit comté aop affiné dans une fromagerie de la Nièvre labellisée</label><br>
        <label><input type="radio" name="q1" value="s"> un fauxmage (vegan, bio, éco-responsable, parfait pour la planète)</label><br>
        <label><input type="radio" name="q1" value="r"> un bon camembert bien puant</label>
    </div>

    <div class="question">
        <p>2. Quel personnage du flambeau te correspond le plus ?</p>
        <label><input type="radio" name="q2" value="r"> Marc (je ne sais pas conduire et je pars faire du traffic de drogue en AmLat</label><br>
        <label><input type="radio" name="q2" value="s"> je n'ai pas regardé, je refuse de financer Canal facho ou l'industrie du piratage</label><br>
        <label><input type="radio" name="q2" value="t"> Annick (j'aime le cirque et les chiens)</label><br>
        <label><input type="radio" name="q2" value="m"> Patoche (j'aime l'alcool et la bonne bouffe)</label>
    </div>

    <div class="question">
        <p>3. Si tu devais choisir un super pouvoir, tu voudrais...</p>
        <label><input type="radio" name="q3" value="m"> être un puit sans fond</label><br>
        <label><input type="radio" name="q3" value="r"> du super pouvoir d'achat</label><br>
        <label><input type="radio" name="q3" value="t"> être agile et super souple</label><br>
        <label><input type="radio" name="q3" value="s"> être invisible pour te la jouer Robin des bois</label>
    </div>

    <div class="question">
        <p>4. QUESTION ?</p>
        <label><input type="radio" name="q4" value="s"> être un puit sans fond</label><br>
        <label><input type="radio" name="q4" value="m"> du super pouvoir d'achat</label><br>
        <label><input type="radio" name="q4" value="r"> être agile et super souple</label><br>
        <label><input type="radio" name="q4" value="t"> être invisible pour te la jouer Robin des bois</label>
    </div>

    <button onclick="corrigerQuiz()">Valider mes réponses</button>

    <div id="resultat"></div>

    <script>
        function corrigerQuiz() {
            let scoreT = 0;  /* score troubadour */
            let scoreR = 0;  /* score réel */
            let scoreM = 0;  /* score miam */
            let scoreS = 0;  /* score sc pipo */
            
            
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            const q3 = document.querySelector('input[name="q3"]:checked');
            const q4 = document.querySelector('input[name="q4"]:checked');
           
            if (q1 && q1.value === "t") { scoreT++; }
            else if (q1 && q1.value === "r") { scoreR++; }
            else if (q1 && q1.value === "m") { scoreM++; }
            else if (q1 && q1.value === "s") { scoreS++; }
          
            if (q2 && q2.value === "t") { scoreT++; }
            else if (q2 && q2.value === "r") { scoreR++; }
            else if (q2 && q2.value === "m") { scoreM++; }
            else if (q2 && q2.value === "s") { scoreS++; }

            if (q3 && q3.value === "t") { scoreT++; }
            else if (q3 && q3.value === "r") { scoreR++; }
            else if (q3 && q3.value === "m") { scoreM++; }
            else if (q3 && q3.value === "s") { scoreS++; }

            document.getElementById('resultat').innerText = "Votre score est de : " + scoreT + " / 2";
        }
    </script>

</body>
</html>
